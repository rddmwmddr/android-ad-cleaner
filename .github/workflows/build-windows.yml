# Windows 版：打包、冒烟测试、生成安装程序和便携版 zip。
# 手动运行（Actions → build-windows → Run workflow），或推送 v* 标签时运行并上传到对应 Release。
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 本 workflow 只由 tag push 与手动触发，条件恒为 false：同一 ref 重复触发时排队而非并发，
  # 两个 run 不会同时往同一个 Release 上传附件；取消会打断发版产物构建
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    runs-on: windows-latest
    # 实测最慢 2m50s；20m 留出 choco 装 Inno Setup 这类环境抖动的余量
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
      - name: 安装依赖
        run: pip install -r requirements.txt pywebview pyinstaller pillow
      - name: 安装前端用例依赖（tests/js 用 jsdom，版本按 package-lock.json；回归里的前端用例缺它就红）
        run: npm ci
      - name: 设备无关回归测试
        run: |
          $env:ADB = "$env:ANDROID_HOME\platform-tools\adb.exe"
          python -m unittest discover -s tests -v
      - name: 读版本号
        id: ver
        run: |
          $v = python gui/version.py
          "ver=$v" >> $env:GITHUB_OUTPUT
      # HDC 不入库，打包时按钉死的哈希下载校验（gui/hdc_fetch.py）。key 取三个平台 tarball 的
      # SHA-256 组合：上游重发 SDK 时缓存自然失效，冷构建只下载一次。
      - name: 缓存鸿蒙 HDC
        uses: actions/cache@v4
        with:
          path: ~/.cache/android-ad-cleaner/hdc
          key: hdc-7.0-Release-391d76cb90d69b476ae0b65a9f311c572e1a9cdd77da71734af62ed63b108dcc-df46e398b391d3406d1eb05e7322c5874f6bf6821e93b1211b36cfcf7a0bbf6f-130a438cbcddd46a2a5b09ee9925339cddf4cca99223329b860f96a5c72f338f
      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --distpath gui/dist --workpath gui/build gui/windows.spec
      - name: 冒烟测试（命令行、GUI 页面、图片与 JS API）
        run: |
          $env:ADB = "$env:ANDROID_HOME\platform-tools\adb.exe"
          $env:ADBUTILS_ADB_PATH = $env:ADB
          python gui/smoke_test.py gui\dist\AndroidAdCleaner\aac-cli.exe --gui
      - name: 便携版 zip
        run: Compress-Archive -Path gui/dist/AndroidAdCleaner -DestinationPath "gui/dist/AndroidAdCleaner-${{ steps.ver.outputs.ver }}-windows-portable.zip"
      - name: 安装程序（Inno Setup）
        run: |
          try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile gui/ChineseSimplified.isl } catch { Write-Host "中文语言包下载失败，安装界面用英文" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAPPVER=${{ steps.ver.outputs.ver }}" gui/installer.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ steps.ver.outputs.ver }}
          path: |
            gui/dist/*.zip
            gui/dist/*-setup.exe
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "请先创建对应的 Release 草稿" }
          if (-not $release.isDraft) {
            Write-Host "Release 已公开，保留已验证文件及 SHA256，不用重建产物覆盖。"
            exit 0
          }
          foreach ($file in Get-ChildItem gui/dist/*.zip, gui/dist/*-setup.exe) {
            if ($release.assets.name -contains $file.Name) {
              Write-Host "已存在，保留：$($file.Name)"
              continue
            }
            gh release upload $tag $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "上传失败：$($file.Name)" }
          }
