# 手机版的编译闸门：Kotlin 侧此前没有任何 CI 覆盖，`Shell.kt` 编译不过能一路进 main（#678）。
# 编译 debug 并跑协议层的 JVM 单测（不签名、不上架）；正式包仍走 build-windows.yml 那套发布流程。
name: android
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 同一 PR 重推时取消上一轮；main push 与手动触发不取消
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  assemble:
    runs-on: ubuntu-latest
    # 首次构建要下载 Gradle、Chaquopy 的 Python 与 pip 依赖，比后续慢得多
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: 装 Gradle（与本地 build.sh 同版）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
      - name: 装构建用的 Python 3.12（Chaquopy 要它跑 pip）
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 告诉 Gradle 用哪个 Python
        run: echo "CHAQUOPY_PYTHON=$(command -v python3.12 || command -v python3)" >> "$GITHUB_ENV"
      - name: 编译 debug APK 并跑协议层 JVM 单测
        run: gradle --console=plain assembleDebug testDebugUnitTest
      # 构建目录在 ~/Library/Caches（见 app/build.gradle.kts），先拷到 runner 的临时目录再上传
      - name: 拿出 debug APK
        run: cp "$HOME/Library/Caches/aac-android/app/outputs/apk/debug/"*.apk "$RUNNER_TEMP/"
      # 冒烟脚本（android/smoke.py）按这个名字下载；改动时两处一起改
      - name: 留存 debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: ${{ runner.temp }}/*.apk
          if-no-files-found: error
