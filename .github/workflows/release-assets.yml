# 下载页的 REL 与 GitHub Release 附件对账（#1136，沿用 #1003）。
# 附件改名、漏传，或 REL 里留了上一版的文件名，用户点下载就是 404，而页面脚本不报错；
# 名字对上了、大小或 sha 却不是同一批字节时，用户手里的校验值也是错的。
# 本地复现同一条命令：
#   python3 tool/release_assets.py          # 比 REL.version 那个 tag，只比文件名
#   python3 tool/release_assets.py v0.4.0   # 比指定的 tag
#   python3 tool/release_assets.py --sha    # 文件名、大小、sha 三类都比
# 退出码：0 一致；1 任一不一致（输出分行差异）；2 取数失败——网络抖动不该被当成不一致。
# 比 sha 不会误报：同一 tag 的资产内容不可变，换文件必须重发版，sha 不会自己漂。
name: release-assets
on:
  schedule:
    # 每周一 UTC 02:00 = 北京时间 10:00
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: 要比对的 Release tag（留空取 index.html 的 REL.version）
        required: false
permissions:
  contents: read          # 读公开 Release 的资产元数据（名字、大小、摘要）就够，不需要额外 secret
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 比对附件名、大小与 sha
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 tool/release_assets.py "$TAG" --sha
