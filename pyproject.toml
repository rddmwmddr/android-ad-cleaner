# ruff 的规则集只在这里定义；目标路径属于命令，写在 CI 与文档里的那条命令上。
[tool.ruff]
# 仓库根另有一个独立 git 仓（.private），本地全量 lint 不该扫进去。
extend-exclude = [".private"]

[tool.ruff.lint]
# F：未定义名 / 未使用导入；E9：语法错误；B：bugbear 的「形状」类错误（闭包捕获循环变量、
# zip 缺 strict、盲断异常等）。不加格式与行长规则。
select = ["F", "E9", "B"]

# 类型检查只接窄口径：扫引擎目录，扫界面目录与机型脚本不在范围。
[tool.mypy]
# 扫描范围属于配置：`gui/` 有自己的平台分支与假对象，`recipes/` 靠注入作用域执行，
# 静态分析在那里看到的全是未定义名。
files = ["tool"]
# 与 `.python-version`、跑 unittest 的 Linux job 同版。
python_version = "3.13"
# 宽松档：函数体里的表达式照查，但不要求给每个函数补注解。
check_untyped_defs = true
# 空列表 / 空字典补注解（var-annotated）是宽松档本身的一部分：它只报「请给空列表补类型」，
# 不掩盖别的错误。其余错误的压制一律不做。
disable_error_code = ["var-annotated"]

# 这六个模块不碰设备、不碰手机界面、不依赖假对象，注解可以一路追到调用方；
# 严格档给它们，其余引擎目录保持宽松档（#997）。`tool/` 没有 `__init__.py`，
# 模块名就是文件名，不是 `tool.<名字>`。
#
# 不写 `strict = true`：实测 mypy 1.18.2 在 overrides 里把它当全局设置（全仓一起变严格），
# per-module 只认逐项 flag。`warn_redundant_casts` 不是 per-module 可写项，
# `warn_unused_configs` 只对全局有意义，两项只能留在缺省。
[[tool.mypy.overrides]]
module = ["polarity", "channel_policy", "host", "events", "recipe_meta", "reader"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_optional = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# 两个运行时依赖没有 py.typed、也没出 stub 包；按「解析不到」处理，
# 不把它们的 Any 算进我们自己的检查面。
[[tool.mypy.overrides]]
module = ["adbutils", "adbutils.*", "uiautomator2", "uiautomator2.*"]
ignore_missing_imports = true
