# vivo V2309A 页面树（catalog，#1263）。路径 2026-11-02 真机逐段实测。
model = "V2309A"
models = ["V2309A"]
build = "PD2309E_A_16"

[const]
GEAR_TOP_STYLE = "vivo"
TAP_ROW_STYLE = "row_span"

[[segment]]
name = "系统广告"
ops = [{ kind = "lib", name = "system_ads_branch" }]

[[segment]]
name = "全局搜索"
ops = [{ kind = "lib", name = "global_search_ads" }]

[[segment]]
name = "阅图锁屏"
ops = [{ kind = "lib", name = "lock_screen_magazine" }]

[[segment]]
name = "应用商店"
ops = [
  { kind = "start", pkg = "com.bbk.appstore", expect = ["我的"] },
  { kind = "require_tab", name = "我的", miss_print = "底部没有「我的」标签，商店可能停在开屏或推荐页" },
  { kind = "require_lib", name = "gear_top", miss_print = "「我的」页没找到右上角齿轮" },
  { kind = "require_lib", name = "tap_row", args = ["关于"], miss_print = "商店设置页没找到「关于」" },
  { kind = "gated", entries = ["个性化推荐"], ops = [
    { kind = "off", only = ["个性化推荐", "个性化广告推荐"], page = "商店·个性化推荐" },
    { kind = "back" },
    { kind = "sleep", seconds = 0.5 },
  ]},
  { kind = "gated", entries = ["服务管理"], ops = [
    { kind = "off", only = ["签到有礼", "顶部轮播图", "顶部栏目", "开屏", "摇一摇", "悬浮球", "限时推广"], keep = ["我的服务", "空间清理"], page = "商店·服务管理" },
    { kind = "back" },
  ]},
  { kind = "back" },
  { kind = "if_lib", name = "tap_row", args = ["消息提醒"], ops = [
    { kind = "off", only = ["资讯活动提醒"], page = "商店·消息提醒" },
    { kind = "back" },
  ]},
  { kind = "back", n = 2 },
]

[[segment]]
name = "浏览器"
ops = [{ kind = "lib", name = "browser_recommendations" }]

[[segment]]
name = "i管家"
ops = [{ kind = "lib", name = "i_manager_ads" }]

[[segment]]
name = "天气"
ops = [
  { kind = "shell", command = "am start -f 0x10008000 -n com.vivo.weather/.WeatherSettings" },
  { kind = "sleep", seconds = 1.0 },
  { kind = "off", only = ["天气服务"], keep = ["气象预警", "异常天气", "地震预警"], page = "天气·设置" },
]
