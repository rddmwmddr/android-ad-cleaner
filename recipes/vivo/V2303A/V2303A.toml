# vivo V2303A 页面树（catalog，#1263）。Android 17 / OriginOS 7，2026-11-04 真机实测。
# 系统广告 / 全局搜索 / 阅图锁屏 用 p.setting 关键词直达；全局搜索的多页循环是过程段，走 code=
# 例外函数。应用商店的设置页直达与「我的 → 设置」兜底都是导航数据。
model = "V2303A"
models = ["V2303A"]
build = "CP2A.260605.016"

[const]
GEAR_STYLE = "vivo"

[[segment]]
name = "系统广告"
ops = [
  { kind = "require_setting", kw = "广告与隐私", miss_print = "没搜到「广告与隐私」" },
  { kind = "off", only = ["个性化广告", "个性化推荐", "智能推荐服务"], page = "系统·广告与隐私" },
]

[[segment]]
name = "全局搜索"
# 裁决：「循环」+「按读到的状态收窄」。三组（入口, 开关）逐个进，单页异常吞掉继续
code = "step_global_search"

[[segment]]
name = "阅图锁屏"
ops = [
  { kind = "require_setting", kw = "锁屏设置", miss_print = "没搜到「锁屏设置」" },
  { kind = "gated", entries = ["阅图锁屏"], ops = [
    { kind = "off", only = ["阅图锁屏", "锁屏横滑进入阅图"], page = "阅图锁屏" },
  ]},
]

[[segment]]
name = "应用商店"
ops = [
  # 「我的」页没有能读到的齿轮入口，设置页只能按 Activity 直达（沿用 #220）；不通再走「我的 → 设置」。
  { kind = "if_lib", name = "store_settings_direct", args = ["com.bbk.appstore", ".ui.menu.AppstoreSettingsActivity", "AppstoreSettingsActivity"], else_ops = [
    { kind = "start", pkg = "com.bbk.appstore", expect = ["我的"] },
    { kind = "require_tab", name = "我的", miss_print = "商店底部「我的」标签没找到" },
    { kind = "sleep", seconds = 0.8 },
    { kind = "lib", name = "gear" },
  ]},
  { kind = "if_entry", text = "关于", ops = [
    { kind = "if_entry", text = "个性化推荐", ops = [
      { kind = "off", only = ["个性化推荐", "个性化广告推荐"], page = "商店·个性化推荐" },
      # off 会往下翻；这一页的开关在上面时别错过
      { kind = "top" },
      { kind = "lib", name = "off_unnamed", args = ["商店·个性化推荐"] },
      { kind = "back" },
      { kind = "sleep", seconds = 0.5 },
    ]},
    { kind = "if_entry", text = "服务管理", ops = [
      { kind = "off", only = ["签到有礼", "顶部轮播图", "顶部栏目", "开屏", "摇一摇", "悬浮窗", "限时推广"], keep = ["我的服务", "空间清理"], page = "商店·服务管理" },
      { kind = "back" },
    ]},
    { kind = "back" },
  ]},
  { kind = "back", n = 2 },
]

[[segment]]
name = "浏览器"
ops = [{ kind = "lib", name = "browser_recommendations" }]

[[segment]]
name = "i管家"
ops = [{ kind = "lib", name = "i_manager_ads" }]

[[segment]]
name = "天气"
ops = [{ kind = "lib", name = "weather_service" }]
