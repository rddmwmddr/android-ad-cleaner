# vivo V2547DA（卫星通信版）Android 17 变体页面树（catalog，#1263）。系统版本对上 17.1.10.2 时由 run.recipe_for 选这份。
# 与主本差别只在直达优先（`direct_page` / `global_search_entry`）的几段；全部七段都是数据，
# 本机没有 code= 例外函数。
model = "V2547DA"
models = ["V2547DA"]
build = "PD2547D_A_17.1.10.2"

[const]
GEAR_STYLE = "vivo_landing"

[[segment]]
name = "系统广告"
ops = [
  # 广告与隐私页能直达就直达；不通才走 设置 → 安全 / 安全与隐私 → 更多安全设置。
  { kind = "if_lib", name = "direct_page", args = ["com.android.settings", ".Settings$AdAndPrivacyActivityForOsTwo"], kwargs = { expect = "智能推荐服务" }, ops = [
    { kind = "off", only = ["个性化广告", "个性化推荐", "智能推荐服务"], page = "系统·广告与隐私" },
    { kind = "return" },
  ], else_ops = [
    { kind = "lib", name = "system_ads_branch" },
  ]},
]

[[segment]]
name = "全局搜索"
ops = [
  # 设置页能直达就直达，不通再从设置首页走「系统管理与升级 → 全局搜索」；两级都认不出才收段。
  { kind = "if_lib", name = "global_search_entry", args = ["com.vivo.globalsearch", ".view.SearchSettingsActivity", "首页展示内容"], else_ops = [
    { kind = "return" },
  ]},
  { kind = "if_entry", text = "首页展示内容", ops = [
    { kind = "off", only = ["搜索框推荐词", "推荐卡片"], page = "全局搜索·首页展示内容" },
    { kind = "back" },
  ]},
  # Android 17 上没有「推荐热搜榜单」这个入口（沿用 #220）。这一页只有几行，看一眼就够，不滚也不等。
  { kind = "if_find", text = "推荐热搜榜单", exact = true, ops = [
    { kind = "if_entry", text = "推荐热搜榜单", scrolls = 0, ops = [
      { kind = "off", only = ["热门搜索"], page = "全局搜索·热搜榜单" },
      { kind = "back" },
    ]},
  ]},
  # 历史记录、应用建议保留。
  { kind = "if_entry", text = "个性化内容", ops = [
    { kind = "off", only = ["广告个性化"], page = "全局搜索·个性化内容" },
    { kind = "back" },
  ]},
]

[[segment]]
name = "阅图锁屏"
ops = [
  # 阅图锁屏页是独立 Activity，直达最稳；没导出这一页的版本退回 设置 → 桌面、锁屏与壁纸 → 锁屏设置。
  { kind = "if_lib", name = "direct_page", args = ["com.vivo.magazine", ".ui.MagazineSettings"], kwargs = { expect = "锁屏横滑进入阅图" }, ops = [
    { kind = "off", only = ["阅图锁屏", "锁屏横滑进入阅图"], page = "阅图锁屏" },
    { kind = "return" },
  ], else_ops = [
    { kind = "lib", name = "lock_screen_magazine" },
  ]},
]

[[segment]]
name = "应用商店"
ops = [
  # 「我的」页没有能读到的齿轮入口，设置页只能按 Activity 直达（沿用 #220）；不通再走「我的 → 设置」。
  { kind = "if_lib", name = "store_settings_direct", args = ["com.bbk.appstore", ".ui.menu.AppstoreSettingsActivity", "AppstoreSettingsActivity"], else_ops = [
    { kind = "start", pkg = "com.bbk.appstore", expect = ["我的"] },
    { kind = "require_tab", name = "我的", miss_print = "商店底部「我的」标签没找到" },
    { kind = "sleep", seconds = 0.8 },
    { kind = "lib", name = "gear" },
  ]},
  { kind = "if_entry", text = "关于", ops = [
    { kind = "if_entry", text = "个性化推荐", ops = [
      { kind = "off", only = ["个性化推荐", "个性化广告推荐"], page = "商店·个性化推荐" },
      # off 会往下翻；这一页的开关在上面时别错过
      { kind = "top" },
      { kind = "lib", name = "off_unnamed", args = ["商店·个性化推荐"] },
      { kind = "back" },
      { kind = "sleep", seconds = 0.5 },
    ]},
    { kind = "if_entry", text = "服务管理", ops = [
      { kind = "off", only = ["签到有礼", "顶部轮播图", "顶部栏目", "开屏", "摇一摇", "悬浮窗", "限时推广"], keep = ["我的服务", "空间清理"], page = "商店·服务管理" },
      { kind = "back" },
    ]},
    { kind = "back" },
  ]},
  { kind = "back", n = 2 },
]

[[segment]]
name = "浏览器"
ops = [{ kind = "lib", name = "browser_recommendations" }]

[[segment]]
name = "i管家"
ops = [{ kind = "lib", name = "i_manager_ads" }]

[[segment]]
name = "天气"
ops = [{ kind = "lib", name = "weather_service" }]
