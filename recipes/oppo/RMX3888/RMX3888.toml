# realme 真我 GT5 Pro（RMX3888，ColorOS 15.0.0.420(CN01) / Android 15）的页面树（catalog，#1265）。
# 按报告者（沿用 #1083）逐段实测的落点写成，本仓库没有这台手机，未在真机复跑，待复测。
# 只关点名的广告与推荐；营销通知、组件挂起与快应用仍走 run.py 的独立确认流程。
#
# 本机实测与同族 OPPO 脚本的差别（别照抄别家脚本的路径）：
#   · 广告跟踪在「隐私 → 更多 → 设备标识与广告 → 广告跟踪」，页内 219 个开关
#     （`com.oplus.settings.feature.notification.oaid.OAIDActivity`）。
#   · 负一屏这一层没有「推荐服务 → 轮播推荐」，也没有「搜索框提示词」；推荐服务与热点资讯默认已关。
#     设置页是 `com.oplus.assistantscreen.setting.AssistantScreenSettingActivity`。
#   · 软件商店的个性化推荐是子页 `com.heytap.market.mine.PersonalRecommendActivity`，不是就地开关；
#     服务管理 46 项。
#   · 浏览器 40.9.14.1 的「隐私」页已没有「广告管理」入口；主页布局默认已经是「简洁」。
#     设置页可以直达 `com.heytap.browser/.settings.component.BrowserPreferencesPage`。
#   · 主题商店的包名是 `com.oplus.themestore`（不是同族的 `com.heytap.themestore`），而且没有
#     启动界面：`resolve-activity` 返回 No activity found，这一段在本机做不了。
#   · `com.heytap.yoli` 只有本地视频播放器（`LocalVideosListActivity`），没有在线内容与「我的」页。
#   · 游戏中心 `com.nearme.gamecenter` 确实未安装。
#   · 设置里的小布建议入口叫「AI」（`com.coloros.sceneservice`），不叫「OPPO AI」；总开关默认已关。
# 广告跟踪 / 下拉搜索 / 浏览器 / 小布建议四段已落数据（落点断言 + 一层条件分支）；负一屏（手势状态机）、
# 软件商店（多层嵌套的条件树）、主题（try/except 只认「无法打开」）、视频（`require(p.tap)`）、
# 游戏中心（`tap_icon` + 复合条件）留 `code=`。
model = "RMX3888"
models = ["RMX3888"]
build = "RMX3888_15.0.0.420"

[[segment]]
name = "广告跟踪"
ops = [
  # 每个 App 一个 OAID 开关、没有总开关（本机 219 个），新装 App 默认开，整页关掉即可。
  { kind = "skip_in_safe_mode" },
  # 先试「隐私 → 更多 → 设备标识与广告 → 广告跟踪」，老版本没有「更多」这一级就退回直接点。
  { kind = "if_lib", name = "settings_page", args = ["隐私", "更多", "设备标识与广告", "广告跟踪"], ops = [], else_ops = [{ kind = "miss_reset" }, { kind = "if_lib", name = "settings_page", args = ["隐私", "设备标识与广告", "广告跟踪"], ops = [], else_ops = [{ kind = "fail", text = "设置里没走到「隐私 → 更多 → 设备标识与广告 → 广告跟踪」" }] }] },
  { kind = "page", args = ["广告跟踪", "com.android.settings", "OAIDActivity"] },
  { kind = "off", page = "广告跟踪", page_wide = true, max_screens = 40 },
]

[[segment]]
name = "负一屏"
code = "step_negative_screen"

[[segment]]
name = "下拉搜索"
ops = [
  # 搜索设置首页本身 0 个开关，开关都在子页里。「账号与隐私」是分组标题，点它多数情况没反应。
  { kind = "shell", command = "am start -f 0x10008000 -a android.intent.action.VIEW -d 'gs://search/setting'" },
  { kind = "sleep", seconds = 1.8 },
  { kind = "if_focus", text = "SuspendedAppActivity", ops = [{ kind = "skip", text = "com.heytap.quicksearchbox 被挂起了，全局搜索不可用；先 run.py unsuspend com.heytap.quicksearchbox 再跑本段" }] },
  { kind = "page", args = ["搜索范围", "com.heytap.quicksearchbox", "SearchSettingActivity"] },
  { kind = "if_tap", text = "搜索范围", exact = true, ops = [{ kind = "off", only = ["个性化推荐", "精选资讯"], page = "下拉搜索·搜索范围" }, { kind = "back" }] },
  # 语音搜索、扫一扫是功能，搜索历史是用户自己的记录，只关提示词。
  { kind = "if_tap", text = "功能管理", exact = true, ops = [{ kind = "off", only = ["搜索框提示词"], page = "下拉搜索·功能管理" }, { kind = "back" }] },
  { kind = "miss_reset" },
  { kind = "if_tap", text = "账号与隐私", exact = true, else_ops = [{ kind = "miss_reset" }] },
  { kind = "if_tap", text = "隐私", exact = true, ops = [{ kind = "off", only = ["个性化推荐"], page = "下拉搜索·隐私" }, { kind = "back", n = 2 }] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "软件商店"
code = "step_store"

[[segment]]
name = "浏览器"
ops = [
  # 40.9.14.1 的「隐私」页已没有「广告管理」入口；主页布局默认已是「简洁」。
  # 首页也没有底部「我的」和菜单，只能按页面名直达设置页（带清栈参数会立刻退出）。
  { kind = "start", pkg = "com.heytap.browser" },
  { kind = "shell", command = "am start -n com.heytap.browser/com.heytap.browser.settings.component.BrowserPreferencesPage" },
  { kind = "sleep", seconds = 1.5 },
  { kind = "require_focus", contains = "com.heytap.browser", miss_print = "浏览器设置页没有打开" },
  { kind = "if_tap", text = "主页设置", exact = true, ops = [{ kind = "if_tap", text = "页面布局", exact = true, ops = [{ kind = "tap", text = "简洁", exact = true, scrolls = 0 }, { kind = "back" }] }, { kind = "back" }] },
  { kind = "if_tap", text = "隐私", exact = true, ops = [{ kind = "if_tap", text = "广告管理", exact = true, ops = [{ kind = "off", only = ["开屏广告", "资讯列表广告", "摇一摇广告"], page = "浏览器·广告管理" }], else_ops = [{ kind = "print", text = "  · 「隐私」页没有「广告管理」，本段没有可关的项（本机 40.9.14.1）" }] }, { kind = "back" }] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "主题"
code = "step_theme"

[[segment]]
name = "视频"
ops = [
  # 本机 com.heytap.yoli 只有本地视频播放器（LocalVideosListActivity），没有在线内容与「我的」页。
  { kind = "start", pkg = "com.heytap.yoli" },
  { kind = "if_entry", text = "我的", else_ops = [{ kind = "skip", text = "本机视频 App 只有本地视频播放器，没有在线内容与「我的」页" }] },
  { kind = "require_tap", text = "设置", exact = true, scrolls = 0, miss_print = "视频「我的」页没找到「设置」" },
  { kind = "if_tap", text = "个性化内容管理", exact = true, ops = [{ kind = "off", only = ["个性化推荐"], page = "视频·个性化内容管理" }, { kind = "back" }] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "游戏中心"
code = "step_game_center"

[[segment]]
name = "小布建议"
ops = [
  # 本机设置里的入口叫「AI」（com.coloros.sceneservice 的设置页），不叫「OPPO AI」；
  # 报告者实测「小布建议」总开关默认已关，没再往下点。开着时才去二级页关「资讯服务」。
  { kind = "if_lib", name = "settings_page", args = ["AI"], ops = [], else_ops = [{ kind = "if_lib", name = "settings_page", args = ["OPPO AI"], ops = [], else_ops = [{ kind = "fail", text = "设置里没找到小布建议入口（「AI」/「OPPO AI」）" }] }] },
  { kind = "page", args = ["小布建议"], kwargs = { activity = "SettingsActivity" } },
  { kind = "if_tap", text = "资讯服务", exact = true, ops = [{ kind = "off", only = ["资讯服务"], page = "小布建议·资讯服务" }], else_ops = [{ kind = "print", text = "  · 没有「资讯服务」入口（本机小布建议总开关默认已关）" }] },
  { kind = "back", n = 2 },
]
