# OPPO Find N6（PLP120，ColorOS 16.0.9 / ColorOS 17）的页面树（catalog，#1265）。
# 路径 2026-10-22 实测，机型脚本整段跑待验证；2026-11-10 补 ColorOS 17（PLP120_17.0.0.109 / Android 17）
# 的两段路径，未复测（沿用 #905）。
# 广告跟踪（两次入口回退 + 整页全关）、软件商店、主题、视频四段已落数据；负一屏/下拉搜索/浏览器/
# 游戏中心/小布建议留 `code=`（手势循环、运行期名单、多分支状态机，见各自例外函数）。
model = "PLP120"
models = ["PLP120"]
build = "PLP120_16.0.9"

[[segment]]
name = "广告跟踪"
ops = [
  { kind = "skip_in_safe_mode" },
  # 每个 App 一个开关、没有总开关；新装的 App 默认开。ColorOS 17 首页改叫「隐私与安全」（#165 社区实测）。
  # 先试旧名，失败再试新名；两条都不通就正常收尾（`return`，不算失败）。
  { kind = "if_lib", name = "settings_page", args = ["隐私", "设备标识与广告", "广告跟踪"], ops = [], else_ops = [{ kind = "miss_reset" }, { kind = "if_lib", name = "settings_page", args = ["隐私与安全", "设备标识与广告", "广告跟踪"], ops = [], else_ops = [{ kind = "return" }] }] },
  { kind = "off", page = "广告跟踪", page_wide = true },
]

[[segment]]
name = "负一屏"
code = "step_negative_screen"

[[segment]]
name = "下拉搜索"
code = "step_search"

[[segment]]
name = "软件商店"
ops = [
  { kind = "start", pkg = "com.heytap.market" },
  { kind = "go", text = "我的", expect = "设置" },
  { kind = "tap", text = "设置", exact = true, scrolls = 0 },
  { kind = "if_tap", text = "隐私", exact = true, ops = [{ kind = "off", only = ["个性化推荐"], page = "商店·隐私" }, { kind = "back" }] },
  { kind = "if_tap", text = "服务管理", exact = true, ops = [{ kind = "off", page = "商店·服务管理", page_wide = true, keep = ["帮助与客服", "应用安全", "应用工具", "存储空间清理", "我的资产", "安全守护", "小i客服", "应用使用记录", "首页 AI 搜索", "自动检测风险应用"] }, { kind = "back" }] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "浏览器"
code = "step_browser"

[[segment]]
name = "主题"
ops = [
  { kind = "start", pkg = "com.heytap.themestore" },
  { kind = "go", text = "我的", expect = "设置" },
  { kind = "tap", text = "设置", exact = true, scrolls = 0 },
  { kind = "if_tap", text = "服务管理", exact = true, ops = [{ kind = "if_tap", text = "消息与广告", exact = true, ops = [{ kind = "off", only = ["消息通知", "开屏广告"], page = "主题·消息与广告" }, { kind = "back", n = 2 }] }] },
  { kind = "if_tap", text = "隐私", exact = true, ops = [{ kind = "if_tap", text = "个性化推荐设置", exact = true, ops = [{ kind = "off", only = ["个性化推荐"], page = "主题·个性化推荐" }, { kind = "back", n = 2 }] }] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "视频"
ops = [
  { kind = "start", pkg = "com.heytap.yoli" },
  { kind = "go", text = "我的", expect = "设置" },
  { kind = "tap", text = "设置", exact = true },
  { kind = "if_tap", text = "个性化内容管理", exact = true, ops = [{ kind = "off", only = ["个性化推荐"], page = "视频·个性化" }] },
  { kind = "back", n = 3 },
]

[[segment]]
name = "游戏中心"
ops = [
  # 直达失败才走「我的 → 设置」；这一档也决定最后退回几次（#1373）。
  {kind = "let", name = "direct", lib = "game_settings_direct"},
  {kind = "if_var", name = "direct", ops = [], else_ops = [{kind = "lib", name = "game_settings_via_mine"}]},
  {kind = "enter", text = "隐私开关设置", scrolls = 6},
  {kind = "enter", text = "个性化推荐管理", scrolls = 4},
  # 先等开关画出来再读，读数交给点名核对：缺一项就整段不动。
  {kind = "let", name = "switches", lib = "read_on_page", args = ["个性化推荐管理", "com.nearme.gamecenter"]},
  {kind = "require_switches", before = {expr = "var", name = "switches"}, names = ["个性化推荐"], title = "个性化推荐管理"},
  {kind = "off", only = ["个性化推荐"], page = "游戏中心·个性化推荐"},
  {kind = "if_var", name = "direct", ops = [{kind = "back", n = 3}], else_ops = [{kind = "back", n = 4}]},
]

[[segment]]
name = "小布建议"
ops = [
  # ColorOS 17：「内容资讯」是点不动的分组标题，入口是它下面那行「资讯服务」，开关在二级页
  # （PMX110，沿用 #905）；ColorOS 16 仍是点「内容资讯」进列表页。库里读不到开关时返回 None，
  # 读到了返回 {标题: 状态}——按「不是 None」分岔，空表也算读到了（#1373）。这一页还有快递、
  # 航班、日程提醒与商圈服务，保持不动。
  {kind = "lib", name = "enter_settings", args = ["OPPO AI", "小布建议"]},
  {kind = "page", args = ["小布建议", "com.android.settings"]},
  {kind = "let", name = "switches", lib = "open_switch_page", args = ["资讯服务", "资讯服务", "com.android.settings"]},
  {kind = "if_var", name = "switches", not_none = true, ops = [
    {kind = "require_switches", before = {expr = "var", name = "switches"}, names = ["资讯服务"], title = "资讯服务"},
    {kind = "off", only = ["资讯服务"], page = "小布建议·资讯服务"},
    {kind = "return"},
  ], else_ops = [
    # 旧版本这一页的标题没有实测记录，两种叫法都认。
    {kind = "let", name = "switches", lib = "open_switch_page", args = ["内容资讯", ["内容资讯", "资讯服务"], "com.android.settings"]},
    {kind = "if_var", name = "switches", not_none = true, ops = [
      {kind = "require_switches", before = {expr = "var", name = "switches"}, names = ["资讯服务"], title = "内容资讯"},
      {kind = "off", only = ["资讯服务"], page = "小布建议·内容资讯"},
      {kind = "return"},
    ], else_ops = [
      {kind = "fail", text = "小布建议：「资讯服务」与「内容资讯」两条入口都没进去"},
    ]},
  ]},
]
