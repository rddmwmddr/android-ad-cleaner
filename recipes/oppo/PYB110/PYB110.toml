# 一加 16（PYB110，ColorOS 17.0.0 / Android 17）的页面树（catalog，#1265）。
# 路径实测：2026-11-12 在 17.0.0.155 上录制，九段全跑 397 秒；同日在 17.0.0.157 上复验。
# 2026-11-15 在 17.0.0.157 上复验商店与视频两段（商店 26.8.60、视频 40.10.1.1）。
# 覆盖：广告跟踪、软件商店、浏览器、主题商店、视频、游戏中心、小布建议、负一屏、下拉搜索，共九段。
# 与同族 ColorOS 17 脚本的几处差别：商店「我的」页没有设置文字行，只能用公开设置 Intent；
# 商店设置页的「消息管理」是条件入口（首启出现过，之后读不到），脚本按可选探测；
# 浏览器叫「个性化内容」；负一屏没有推荐服务入口，个性化开关在「隐私 → 个性化推荐」里按模块给。
# 视频段与 PLR110 同形（「个性化管理」+ 广告/内容两个开关）。
model = "PYB110"
models = ["PYB110"]
build = "PYB110_17.0.0"

# 家族库按这些常量选走法（沿用 #1245），缺省档见 recipe_lib/oppo.py。
[const]
SEARCH_SETTINGS_STYLE = "swipe_strict"

[[segment]]
name = "广告跟踪"
ops = [
  { kind = "lib", name = "ad_tracking_close_all" },
]

[[segment]]
name = "软件商店"
ops = [
  # 「我的」页没有「设置」文字行，只有右上角齿轮；用公开设置 Intent 直达设置页。
  { kind = "start", action = "oppo.intent.action.APP_SETTINGS", pkg = "com.heytap.market" },
  { kind = "sleep", seconds = 1.5 },
  { kind = "if_lib_any", calls = [{ method = "in_settings_page" }], else_ops = [
    { kind = "fail", text = "商店设置页没有打开" },
  ] },
  # 「消息管理」是条件入口：首启时出现过一行，之后整页与各子页都读不到（把系统渠道
  # 「热门内容推送」关了再开也不回来），App 资源里仍留着这条文案与「我的-设置-消息管理」
  # 的帮助句。只翻前两屏探测：翻满整页常态下多花 40 秒找一条不存在的行；若它出现在更靠下
  # 的位置，这一档会漏掉（没有验证过它当时在哪一屏）。
  { kind = "if_entry", text = "消息管理", scrolls = 1, ops = [
    # 下载/更新/安装提醒是功能通知，只关热门内容推送。
    { kind = "off", only = ["热门内容推送"], page = "商店·消息管理" },
    { kind = "back" },
  ] },
  # 有界探测会把设置页停在半途；后面的入口从页顶找才不会点到半加载的服务管理页。
  { kind = "top" },
  { kind = "if_tap", text = "服务管理", exact = true, ops = [
    # 服务管理里只保留功能项，其余推广入口全关（本机 2026-11-12 实测共 46 项开关）。
    { kind = "off", keep =["帮助与客服", "应用安全", "我的专区：应用工具", "我的专区：存储空间清理", "我的专区：我的资产", "我的专区：安全守护", "我的专区：小i客服", "应用使用记录", "首页：AI搜索"], page = "商店·服务管理", page_wide = true },
    { kind = "back" },
  ] },
  # 「账号与隐私」分组下的「账号设置」没有广告开关，不进。
  { kind = "if_tap", text = "隐私", exact = true, ops = [
    # 「个性化推荐」在这一页是入口行，开关在下一层的 PersonalRecommendActivity。
    { kind = "if_tap", text = "个性化推荐", exact = true, ops = [
      { kind = "off", only = ["个性化推荐"], page = "商店·个性化推荐" },
      { kind = "back" },
    ] },
    { kind = "back" },
  ] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "浏览器"
ops = [
  { kind = "start", pkg = "com.heytap.browser" },
  # 首页读不到「我的」/菜单入口，用实测可直达的设置页 Activity；带清栈参数会立刻退出。
  { kind = "start", pkg = "com.heytap.browser", activity = ".settings.component.BrowserPreferencesPage", clear_task = true },
  { kind = "sleep", seconds = 1.2 },
  { kind = "require_focus", contains = "com.heytap.browser", miss_print = "浏览器设置页没有打开" },
  { kind = "if_tap", text = "主页设置", exact = true, ops = [{ kind = "if_tap", text = "页面布局", exact = true, ops = [{ kind = "tap", text = "简洁", exact = true, scrolls = 0 }, { kind = "back" }] }, { kind = "back" }] },
  { kind = "if_tap", text = "隐私", exact = true, ops = [
      # 摇一摇广告随上级开关灰置（开屏/资讯列表都关了就不会展示），不点它。
      { kind = "if_tap", text = "广告管理", exact = true, ops = [{ kind = "off", only = ["开屏广告", "资讯列表广告"], page = "浏览器·广告管理" }, { kind = "back" }] },
      # ColorOS 17.0.0.155 的入口叫「个性化内容」，不是 PLR110 上的「个性化管理」。
      { kind = "if_entry", text = "个性化内容", ops = [{ kind = "off", only = ["个性化内容"], page = "浏览器·个性化内容" }, { kind = "back" }] },
      { kind = "back" },
  ] },
  # 允许通知、互动消息、锁屏通知、其他服务保留；资讯类推送关掉。
  { kind = "if_entry", text = "消息管理", ops = [{ kind = "off", only = ["精彩推荐", "重点时事", "本地资讯", "个性化推荐"], page = "浏览器·消息管理" }, { kind = "back" }] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "主题商店"
ops = [
  { kind = "lib", name = "theme_shop_settings" },
]

[[segment]]
name = "视频"
ops = [
  { kind = "start", pkg = "com.heytap.yoli", settle = 4 },
  { kind = "require_go", text = "我的", expect = "设置", miss_print = "没找到「我的」标签" },
  { kind = "tap", text = "设置", exact = true, scrolls = 0 },
  # 40.10.1.1 起入口叫「个性化管理」（此前的「个性化内容管理」已改名），开关分广告与内容两项。
  { kind = "if_tap", text = "个性化管理", exact = true, ops = [{ kind = "off", only = ["个性化广告推荐", "个性化内容推荐"], page = "视频·个性化管理" }, { kind = "back" }] },
  # 互动消息、服务通知、会员权益、其他服务保留。
  { kind = "if_tap", text = "消息通知", exact = true, ops = [{ kind = "off", only = ["热点时事", "精彩推荐", "个性化推荐", "本地新闻"], page = "视频·消息通知" }, { kind = "back" }] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "游戏中心"
ops = [
  { kind = "lib", name = "game_center_taps" },
]

[[segment]]
name = "小布建议"
ops = [
  { kind = "lib", name = "assistant_advice_search" },
]

[[segment]]
name = "负一屏"
ops = [
  # 速览内嵌在桌面进程里，右滑进去只能按首页文案判（家族库 assistant_swipe_in）。
  { kind = "require_lib", name = "assistant_swipe_in", kwargs = { text = "我的服务", exact_text = "添加卡片" }, miss_print = "右滑没进速览（负一屏）；", fail = true },
  # 左上角入口这版叫「我的」，不叫「头像」。
  { kind = "require_go", text = "我的", expect = "设置", miss_print = "没找到「我的」入口" },
  { kind = "tap", text = "设置", exact = true, scrolls = 0 },
  # 这台机（速览 17.0.48）没有「推荐服务 / 轮播推荐」入口，也没有「搜索框提示词」：
  # 个性化开关挪到了「隐私 → 个性化推荐」，模块分成 快捷服务 / 卡片服务 / 热点资讯。
  { kind = "if_tap", text = "消息管理", exact = true, ops = [
    # 快递取件、赛事提醒这类服务通知是功能项，只关服务资讯推荐。
    { kind = "off", only = ["最新服务资讯通知"], page = "负一屏·消息管理" },
    { kind = "back" },
  ] },
  { kind = "if_tap", text = "隐私", exact = true, ops = [
    { kind = "if_tap", text = "个性化推荐", exact = true, ops = [
      { kind = "off", only = ["热点资讯"], page = "负一屏·个性化推荐" },
      { kind = "back" },
    ] },
    { kind = "back" },
  ] },
  { kind = "back", n = 3 },
]

[[segment]]
name = "下拉搜索"
ops = [
  { kind = "lib", name = "search_settings_swipe" },
]
