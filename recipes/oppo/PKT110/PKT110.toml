# OPPO Find X8s（PKT110），ColorOS 17.0.0.102(CN01) / Android 17 的页面树（catalog，#1264）。
# 路径与开关来自 2026-10-28 在 PKT110 真机上逐段实测。
# 不覆盖软件商店（ColorOS 17 的设置页里没有「隐私」「服务管理」，商店首页的推广位也关不掉），
# 也不覆盖负一屏（速览）——那边没有「推荐服务」分组。详见 docs/清单/OPPO-ColorOS.md。
# 2026-11-16：广告跟踪、下拉搜索、游戏中心三段落成数据（#1368），主题商店随后也落成数据（#1371）。
model = "PKT110"
models = ["PKT110"]
build = "PKT110_17.0.0.102(CN01)"
tail = "tail"

# 家族库按这些常量选走法（沿用 #1245），缺省档见 recipe_lib/：点入口按精确文字、
# 读开关只读首屏、关开关的页面要重进一次再回读。
[const]
TAP_STYLE = "exact"
READ_SWITCHES_STYLE = "first"
CLOSE_NAMED_STYLE = "reopen"

[[segment]]
name = "广告跟踪"
ops = [
  { kind = "skip_in_safe_mode" },
  { kind = "start", action = "android.settings.SETTINGS" },
  { kind = "sleep", seconds = 1.2 },
  { kind = "miss_reset" },
  # 17 把入口改名叫「隐私与安全」：先试新名字，免得在旧名字上白翻一轮、还打印一行失败（沿用 #292）。
  { kind = "if_tap", text = "隐私与安全", exact = true, else_ops = [
    { kind = "miss_reset" },
    { kind = "lib", name = "tap", args = ["隐私"] },
  ] },
  { kind = "lib", name = "tap", args = ["设备标识与广告"] },
  { kind = "lib", name = "tap", args = ["广告跟踪"] },
  { kind = "sleep", seconds = 1 },
  # 每个 App 一个开关、没有总开关，本机 96 个 App，分五屏。
  { kind = "lib", name = "close_all", args = ["广告跟踪"], kwargs = { max_screens = 40 } },
]

[[segment]]
name = "下拉搜索"
ops = [
  # 全局搜索的设置页没有导出：`am start -n` 会被系统拒绝（SecurityException: not exported），
  # 只能用它自己的 gs:// scheme 打开。
  { kind = "start", action = "android.intent.action.VIEW", data = "gs://search/setting" },
  { kind = "sleep", seconds = 1.5 },
  { kind = "require_focus", contains = "com.heytap.quicksearchbox", miss_print = "全局搜索设置页没有打开" },
  { kind = "lib", name = "tap", args = ["首页卡片管理"] },
  { kind = "require_focus", contains = "SearchModuleManagerActivity", miss_print = "首页卡片管理页没有打开" },
  { kind = "if_lib", name = "wait_switches", ops = [
    # 「未下载应用推荐」「应用建议小卡」是「应用建议」的子项：父开关一关，这两行就没了。
    { kind = "lib", name = "close_group", args = [["未下载应用推荐", "应用建议小卡"], "应用建议", "下拉搜索·首页卡片管理"], kwargs = { max_screens = 3 } },
    # 「便捷服务」是用户常用的快捷入口，不是广告位，保持不动。
    { kind = "lib", name = "close_named", args = [["热搜应用", "精选推荐", "热搜榜单", "活动皮肤", "推荐卡片"], "下拉搜索·首页卡片管理"], kwargs = { max_screens = 3 } },
  ], else_ops = [
    # 推荐卡片全部关掉之后，这一页就不再列出任何卡片（2026-10-28 实测）。
    { kind = "print", text = "  · 首页卡片管理：这页没有列出卡片，没有可关的开关" },
  ] },
  { kind = "back" },
  { kind = "lib", name = "tap", args = ["搜索范围"] },
  # 搜索结果里带出来的推荐源。「榜单」「小红书」「购物」这些是内容源不是广告位，保持不动。
  { kind = "lib", name = "close_named", args = [["个性化推荐", "精选资讯", "搜索建议"], "下拉搜索·搜索范围"], kwargs = { max_screens = 6 } },
  { kind = "back" },
  { kind = "lib", name = "tap", args = ["功能管理"] },
  { kind = "lib", name = "close_named", args = [["搜索框提示词"], "下拉搜索·功能管理"], kwargs = { max_screens = 2 } },
  { kind = "back" },
  { kind = "lib", name = "tap", args = ["消息管理"] },
  { kind = "lib", name = "close_named", args = [["消息通知"], "下拉搜索·消息管理"], kwargs = { max_screens = 2 } },
  { kind = "back" },
  { kind = "lib", name = "tap", args = ["隐私"] },
  { kind = "lib", name = "close_named", args = [["个性化推荐"], "下拉搜索·隐私"], kwargs = { max_screens = 2 } },
]

[[segment]]
name = "浏览器"
ops = [
  { kind = "start", pkg = "com.heytap.browser" },
  { kind = "start", pkg = "com.heytap.browser", activity = ".settings.component.BrowserPreferencesPage", clear_task = false },
  { kind = "sleep", seconds = 1.5 },
  { kind = "require_focus", contains = "com.heytap.browser", miss_print = "浏览器设置页没有打开" },
  { kind = "lib", name = "tap", args = ["隐私"] },
  { kind = "if_tap", text = "广告管理", exact = true, scrolls = 0, ops = [
    { kind = "lib", name = "close_named", args = [["开屏广告", "资讯列表广告"], "浏览器·广告管理"] },
    { kind = "back" },
  ] },
  { kind = "lib", name = "tap", args = ["个性化管理"] },
  { kind = "lib", name = "close_named", args = [["个性化广告推荐"], "浏览器·个性化管理"] },
]

[[segment]]
name = "主题商店"
# 首页的「检测到新版本」弹窗盖住底部标签栏，关弹窗的动画会把紧跟着的点击吞掉，所以每一跳都用
# 会确认换页的 `enter`（沿用 #286）。
# 进隐私页那四步写了两遍：一次直接进，一次是 `close_named` 的回调实参。数据不能引用块，
# 改一处要同步另一处。
ops = [
  { kind = "start", pkg = "com.heytap.themestore" },
  { kind = "enter", text = "我的" },
  { kind = "require_lib", name = "open_settings", fail = true, miss_print = "没找到「设置」入口：文字与右上角图标都试过" },
  { kind = "enter", text = "服务管理" },
  { kind = "enter", text = "消息与广告" },
  { kind = "lib", name = "close_named", args = [["消息通知", "开屏广告"], "主题·消息与广告"] },
  { kind = "back", n = 2 },
  { kind = "start", pkg = "com.heytap.themestore" },
  { kind = "enter", text = "我的" },
  { kind = "require_lib", name = "open_settings", fail = true, miss_print = "没找到「设置」入口：文字与右上角图标都试过" },
  { kind = "enter", text = "隐私" },
  # 「个性化推荐设置」点下去先弹确认框、确认后退回「设置」，回读前要重进一次——那段重进写成
  # `reopen` 的实参块，库在关完、回读之前调它（CLOSE_NAMED_STYLE = "reopen"）。
  { kind = "lib", name = "close_named", args = [["个性化推荐设置"], "主题·个性化推荐"], kwargs = { reopen = { ops = [
    { kind = "start", pkg = "com.heytap.themestore" },
    { kind = "enter", text = "我的" },
    { kind = "require_lib", name = "open_settings", fail = true, miss_print = "没找到「设置」入口：文字与右上角图标都试过" },
    { kind = "enter", text = "隐私" },
  ] } } },
]

[[segment]]
name = "视频"
ops = [
  { kind = "start", pkg = "com.heytap.yoli" },
  { kind = "enter", text = "我的" },
  { kind = "enter", text = "设置" },
  { kind = "enter", text = "个性化管理", scrolls = 6 },
  { kind = "lib", name = "close_named", args = [["个性化广告推荐", "个性化内容推荐"], "视频·个性化管理"] },
]

[[segment]]
name = "游戏中心"
ops = [
  { kind = "start", pkg = "com.nearme.gamecenter" },
  # 底栏点下去被开屏动画吞掉时页面不换，p.tap 照样返回成功，接着就整段失败；换页要确认（沿用 #286）。
  { kind = "enter", text = "我的" },
  { kind = "sleep", seconds = 1.2 },
  # dismiss() 遇到带滚动列表的页面就不点文字按钮，「页面升级」弹窗的「我知道了」只能点名点。
  { kind = "if_find", text = "我知道了", exact = true, ops = [
    { kind = "tap", text = "我知道了", exact = true, scrolls = 0 },
    { kind = "sleep", seconds = 1.2 },
  ], else_ops = [
    { kind = "dismiss" },
  ] },
  # 「设置」在 14.43.3 上是「我的」页右上角的齿轮图标，没有文字（沿用 #292）；旧版是「设置,有新通知」文字行。
  { kind = "require_lib", name = "open_settings", args = [["隐私开关设置", "隐私"]], miss_print = "没找到设置入口：右上角图标都点过", fail = true },
  { kind = "lib", name = "tap", args = ["隐私开关设置"] },
  { kind = "lib", name = "tap", args = ["个性化推荐管理"] },
  { kind = "lib", name = "close_named", args = [["个性化推荐"], "游戏中心·个性化推荐"] },
]

[[segment]]
name = "小布建议"
ops = [
  { kind = "start", action = "android.settings.SETTINGS" },
  { kind = "sleep", seconds = 1.2 },
  { kind = "lib", name = "tap", args = ["OPPO AI"], kwargs = { scrolls = 6 } },
  { kind = "lib", name = "tap", args = ["小布建议"], kwargs = { scrolls = 6 } },
  { kind = "lib", name = "tap", args = ["资讯服务"], kwargs = { scrolls = 8 } },
  { kind = "lib", name = "close_named", args = [["资讯服务"], "小布建议·资讯服务"] },
  { kind = "lib", name = "tap", args = ["视界日报"], kwargs = { scrolls = 0 } },
  { kind = "lib", name = "close_named", args = [["视界日报"], "小布建议·视界日报"] },
  { kind = "back" },
  { kind = "lib", name = "tap", args = ["小红书资讯"], kwargs = { scrolls = 0 } },
  { kind = "lib", name = "close_named", args = [["小红书资讯"], "小布建议·小红书资讯"] },
]

[[segment]]
name = "应用建议"
ops = [
  { kind = "skip_in_safe_mode" },
  { kind = "start", action = "android.settings.SETTINGS" },
  { kind = "sleep", seconds = 1.2 },
  { kind = "lib", name = "tap", args = ["OPPO AI"], kwargs = { scrolls = 6 } },
  { kind = "lib", name = "tap", args = ["小布建议"], kwargs = { scrolls = 6 } },
  { kind = "lib", name = "tap", args = ["应用建议"], kwargs = { scrolls = 10 } },
  { kind = "lib", name = "close_all", args = ["应用建议"], kwargs = { max_screens = 40 } },
]
