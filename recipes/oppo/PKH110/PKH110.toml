# OPPO Find N5（PKH110，ColorOS 17.0.0.103）的页面树（catalog，#1264）。路径实测：2026-10-29。
# 只收录已走通的系统广告跟踪、商店、浏览器、主题、下拉搜索；不挂包、不动通知渠道。
# 2026-11-16 全段落成数据（#1368）：浏览器两段、主题商店、下拉搜索的失败档由 `return_lib` 承担，
# 本机例外函数只剩型号守卫、收尾打印与推广位名单。
model = "PKH110"
models = ["PKH110"]
build = "PKH110_17.0.0.103"
guard = "guard"
tail = "tail"

[const]
# 共享段体 store_promotions 的 off_exact 走「允许本机没有这一项」那一档（#1268）。
OFF_EXACT_OPTIONAL = true

[[segment]]
name = "广告跟踪"
ops = [
  {kind = "skip_in_safe_mode"},
  {kind = "start", action = "android.settings.SETTINGS"},
  {kind = "sleep", seconds = 1.5},
  # ColorOS 17：「隐私」已并入「隐私与安全」；设置搜索点结果不跳转，只能走面板路径。
  {kind = "if_tap", text = "隐私与安全", scrolls = 3, else_ops = [
    {kind = "print", text = "  ✗ 没找到「隐私与安全」"},
    {kind = "return", value = false},
  ]},
  {kind = "sleep", seconds = 1.5},
  {kind = "return_lib", name = "tap_page", args = ["设备标识与广告", "DevicesIdentifySettingsActivity", "设备标识与广告"]},
  {kind = "return_lib", name = "tap_page", args = ["广告跟踪", "OAIDActivity", "广告跟踪"]},
  {kind = "return_lib", name = "ad_tracking_close_paged"},
]

[[segment]]
name = "软件商店"
ops = [
  { kind = "lib", name = "store_promotions" },
]

[[segment]]
name = "浏览器首页"
ops = [
  { kind = "lib", name = "browser_home" },
]

[[segment]]
name = "浏览器广告"
ops = [
  { kind = "return_lib", name = "browser_settings_direct" },
  { kind = "return_lib", name = "tap_page", args = ["隐私", "com.heytap.browser.settings.component.BrowserPreferenceActivity", "隐私"] },
  { kind = "return_lib", name = "tap_page", args = ["广告管理", "com.heytap.browser.settings.component.BrowserPreferenceActivity", "广告管理"] },
  # 提示写在关之前：返回的是这一段的结局，`return_lib` 落在最后才对得上旧脚本的 `return completed`。
  { kind = "print", text = "  · 摇一摇广告可能随上级开关灰置；灰置项不计作独立关闭" },
  { kind = "return_lib", name = "off_exact_paged_optional", args = [["开屏广告", "资讯列表广告"], "浏览器·广告管理"], kwargs = { max_screens = 2 } },
]

[[segment]]
name = "浏览器个性化"
ops = [
  # 该页只有「个性化内容推荐」「个性化广告推荐」两项；两项都开时只读到后者的 Switch。
  { kind = "return_lib", name = "browser_settings_direct" },
  { kind = "return_lib", name = "tap_page", args = ["隐私", "com.heytap.browser.settings.component.BrowserPreferenceActivity", "隐私"] },
  { kind = "return_lib", name = "tap_page", args = ["个性化管理", "com.heytap.browser.settings.component.BrowserPreferenceActivity", "个性化管理"] },
  { kind = "return_lib", name = "close_titles", args = [["个性化广告推荐"]] },
]

[[segment]]
name = "主题商店"
ops = [
  # 主题商店的 APP_SETTINGS 页没有固定标题（ColorOS 17 直接落在 SettingActivity 列表），
  # 因此这里只确认前台包名，不等页标题。
  { kind = "start", action = "oppo.intent.action.APP_SETTINGS", pkg = "com.heytap.themestore" },
  { kind = "sleep", seconds = 2.5 },
  { kind = "if_focus", text = "com.heytap.themestore", match = "starts", else_ops = [
    { kind = "print", text = "  ✗ 主题商店设置页没有打开" },
    { kind = "return", value = false },
  ] },
  { kind = "if_tap", text = "服务管理", exact = true, scrolls = 3, ops = [
    { kind = "if_tap", text = "消息与广告", exact = true, scrolls = 2, ops = [
      { kind = "sleep", seconds = 1.2 },
      { kind = "off", only = ["消息通知", "开屏广告"], page = "主题·消息与广告", max_screens = 2 },
      { kind = "back" },
    ] },
    { kind = "back" },
  ] },
]

[[segment]]
name = "下拉搜索"
ops = [
  { kind = "return_lib", name = "open_search_settings" },
  # 「搜索范围」页全是数据源（本机应用、相册、网页搜索结果等），关掉会搜不到东西，不动。
  { kind = "if_tap", text = "首页卡片管理", exact = true, scrolls = 3, ops = [
    { kind = "sleep", seconds = 1.8 },
    # 关掉「探索发现」后，它下面的「每日热榜」「推荐卡片」会从列表里一并消失。
    { kind = "lib", name = "close_titles", args = [["未下载应用推荐", "应用建议小卡", "探索发现", "每日热榜", "推荐卡片"]] },
    { kind = "back" },
    { kind = "sleep", seconds = 1 },
  ], else_ops = [
    { kind = "print", text = "  ✗ 没找到「首页卡片管理」" },
  ] },
  { kind = "return_lib", name = "open_search_settings" },
  { kind = "if_tap", text = "功能管理", exact = true, scrolls = 3, ops = [
    { kind = "sleep", seconds = 1.8 },
    { kind = "lib", name = "close_titles", args = [["搜索框提示词", "搜索框顶部推荐词", "猜你想搜"]] },
    { kind = "back" },
  ], else_ops = [
    { kind = "print", text = "  ✗ 没找到「功能管理」" },
  ] },
]
