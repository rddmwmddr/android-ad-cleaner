# 小米 HyperOS 4 机型脚本：Xiaomi 17 Ultra（2512BPNDAC，标准版，非徕卡版）；2026-10-28 真机实测：HyperOS OS4.0.5.0.XPACNXM / Android 17（SDK 37）/ 系统底包 CP2A.260605.016
# 与 Xiaomi 18 Pro Max、18 Fold 同一个系统底包，但这台的入口有四处不同，都写在本脚本里：
#   ① 系统广告：「广告服务」页只有「个性化广告推荐」；「系统工具广告」是另一个独立页面，
#      只能靠设置搜索命中「系统广告」进去。两条都用 p.setting 直达。
#   ② 应用商店 / 主题：底部「我的」标签的文字能被找到，但点进去后没有「设置」两个字（齿轮是纯图标），
#      所以不能写 p.go("我的", "设置")，要按底部位置点标签再找齿轮。
#      商店设置页会记住上次滚动位置，找「隐私设置」前先滑回页顶。
#   ③ 浏览器：工具栏最右的「设置」按钮点进去是「页面布局」子页，不是设置；
#      正确路径是 底部「菜单」→ 弹窗右上角「设置」。「隐私和安全」在主设置页最底部，要滚动。
#   ④ 日历：右上「更多」对 uiautomator 的点击不响应，只能走 adb input tap；
#      「用户体验计划」在设置页倒数第二项，得先滚到底再点。
# 用法：python3 tool/run.py -s 序列号 recipe [段名…]   不带段名=全跑
# 2026-11-14 转页面树（#1267）：系统广告的两条搜索各自收尾再一起报失败、商店的「个性化服务」
# 按运行时读到的开关位置分岔，两段留在同名 `.py` 的 `code =`；其余段落成导航数据。
model = "2512BPNDAC"
models = ["2512BPNDAC"]
build = "OS4.0.5.0"

# 这台的齿轮是纯图标，另有正文「设置」兜底；浏览器两个按钮都按 resource-id 点。
[const]
GEAR_STYLE = "text"
MENU_STYLE = "ids"

[[segment]]
name = "系统广告"
code = "step_system_ads"

[[segment]]
name = "应用商店"
code = "step_store"

[[segment]]
name = "手机管家"
ops = [{ kind = "lib", name = "security_center" }]

[[segment]]
name = "下载管理"
ops = [{ kind = "lib", name = "downloads" }]

[[segment]]
name = "主题"
ops = [
  # 直达主题管理包的代理页（沿用 #730 的做法：它没有 LAUNCHER，monkey 拉不起来）；经主题商店冷启动
  # 还要过一道重定向过渡窗，前台校验容易误判（#906）。落点被系统转走时仍按跳过收尾。
  { kind = "skip_unless_installed", command = "pm path com.android.thememanager", contains = "package:", text = "  · 本机没有主题管理包，跳过" },
  { kind = "start_or_skip", pkg = "com.android.thememanager", activity = ".ThemeResourceProxyTabActivity", dead_ends = ["com.xiaomi.market", "com.miui.home"], reason = "主题页打不开" },
  # 导航失败以前与「本页没有目标开关」同形：进「我的」、进设置页、点名开关三步都校验，
  # 0 个开关按失败报并带页面现场（#906）。
  { kind = "if_lib_any", calls = [{ name = "bottom_tab", args = ["我的"] }, { method = "go", args = ["我的", "设置"] }], ops = [
    { kind = "require_lib", name = "gear", miss_print = "主题设置入口没找到；", fail = true, evidence = true },
    { kind = "await_page" },
    { kind = "off_required", only = ["每次联网时通知"], keep = ["自动更新"], page = "主题·设置", contains = true },
    { kind = "if_entry", text = "隐私设置", ops = [
      { kind = "off", only = ["个性化推荐"], page = "主题·隐私" },
      { kind = "back" },
    ] },
    { kind = "back", n = 2 },
  ], else_ops = [
    { kind = "fail", text = "未进入主题「我的」；", evidence = true },
  ] },
]

[[segment]]
name = "浏览器"
ops = [
  { kind = "start", pkg = "com.android.browser" },
  { kind = "if_focus", text = "basicmode", match = "icontains", ops = [
    # 拒绝浏览器协议后落到基本模式设置页，设置入口都不在这条路径上，找下去只会空转报错（#414、#460）
    { kind = "print", text = "  · 浏览器处在基本模式，设置入口不在这条路径上，本段跳过" },
    { kind = "return" },
  ] },
  # 工具栏最右那个「设置」按钮点进去是「页面布局」子页（这版特有）。
  # 正确路径：底部「菜单」→ 弹窗右上角「设置」，用 resource-id 定位。
  { kind = "lib", name = "menu_settings" },
  # 「隐私和安全」在主设置页最底部（第 13 项之后），必须滚动
  { kind = "if_entry", text = "隐私和安全", scrolls = 8, ops = [
    { kind = "off", only = ["个性化内容推荐", "个性化广告推荐"], page = "浏览器·隐私和安全" },
    { kind = "back" },
  ] },
  { kind = "if_entry", text = "主页设置", ops = [
    { kind = "off", only = ["宫格位推送"], page = "浏览器·主页设置" },
    { kind = "back" },
  ] },
  { kind = "if_entry", text = "搜索设置", ops = [
    { kind = "off", only = ["猜你想搜"], page = "浏览器·搜索设置" },
    { kind = "back" },
  ] },
  { kind = "if_entry", text = "功能设置", ops = [
    { kind = "off", only = ["小说"], page = "浏览器·功能设置" },
    { kind = "back" },
  ] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "全局搜索"
ops = [{ kind = "lib", name = "global_search" }]

[[segment]]
name = "负一屏"
ops = [{ kind = "lib", name = "negative_screen" }]

[[segment]]
name = "天气和日历"
ops = [
  # 天气：底部城市管理 → 右上更多 → 设置 → 用户体验计划。「天气预警提醒」「异常天气提醒」是安全功能，不动。
  { kind = "start", pkg = "com.miui.weather2" },
  { kind = "if_find", text = "城市管理", exact = true, edge_ok = "tab", ops = [
    { kind = "tap", text = "城市管理", exact = true, scrolls = 0 },
  ] },
  { kind = "if_lib", name = "gear", ops = [
    { kind = "if_entry", text = "用户体验计划", ops = [
      { kind = "off", only = ["推荐", "广告", "个性化", "内容推广", "天气视频卡片"], page = "天气·用户体验计划" },
      { kind = "back" },
    ] },
    { kind = "back", n = 3 },
  ] },
  # 日历：右上「更多」→ 设置 → 滚到底 → 倒数第二项「用户体验计划」。
  # 这版日历的「更多」和「设置」对 uiautomator 的点击不响应，只能走 adb input tap；
  # 列表项反而能正常按文字点，所以进到设置页之后就交回 p.tap。
  { kind = "start", pkg = "com.android.calendar", activity = ".AllInOneActivity" },
  { kind = "sleep", seconds = 2 },
  { kind = "shell", command = "input tap 1098 240" },      # 右上「更多」
  { kind = "sleep", seconds = 1.5 },
  { kind = "shell", command = "input tap 769 647" },       # 菜单里的「设置」
  { kind = "sleep", seconds = 2 },
  # 「用户体验计划」在页底，先滚下去（三屏）
  { kind = "shell", command = "input swipe 600 2200 600 500 250" },
  { kind = "sleep", seconds = 0.8 },
  { kind = "shell", command = "input swipe 600 2200 600 500 250" },
  { kind = "sleep", seconds = 0.8 },
  { kind = "shell", command = "input swipe 600 2200 600 500 250" },
  { kind = "sleep", seconds = 0.8 },
  { kind = "if_entry", text = "用户体验计划", scrolls = 2, ops = [
    { kind = "off", only = ["推荐", "广告", "个性化", "内容推广"], page = "日历·用户体验计划" },
  ] },
  { kind = "back", n = 3 },
]
