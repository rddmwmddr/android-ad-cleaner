# HyperOS 4 变体（沿用 PR #298）：同型号的 HyperOS 3 路径在 `24129PN74C.toml`（沿用 PR #312）。系统版本对上 OS4.0 时由 run.recipe_for 选这份。
# 录制：2026-10-29，系统 OS4.0.0.22.XOCCNXM（CP2A.260605.016），九段实测
# 用法：python3 tool/run.py -s 序列号 recipe [段名…]   不带段名=全跑
#
# 与 xiaomi-M154FF（18 Pro Max）的差异，来自 Issue #193：
#   1. 系统广告：隐私与安全 → 更多安全设置 里没有广告服务；广告服务是独立 Activity，可直接拉起
#   2. 应用商店：底部标签文案是「我的，有新消息」，精确匹配「我的」找不到，后面的入口全部走空
#   3. 浏览器：工具栏右上角那个「设置」图标打开的是首页编辑面板；真正的设置在底栏「菜单」里；
#      底栏没有「菜单」时改在「我的」页里找设置（#833 / #900）
#   4. 主题、手机管家、下载管理、全局搜索、负一屏、天气日历与参考脚本一致
# 2026-11-14 转页面树（#1267）：应用商店的等待循环与「我的，有新消息」分岔、全局搜索的榜单循环
# 留在同名 `.py` 的 `code =`；其余段按名字调共享段体或落成导航数据。
model = "24129PN74C"
models = ["24129PN74C"]
build = "OS4.0"

# 齿轮点完要认出设置页（日历的齿轮开的是 PopupWindow，沿用 #407）；浏览器入口是底栏「菜单」，
# 报错只写停在哪一页（这份变体沿用 OS4 录制时的写法）；商店认右上角那个文字就是「设置」的齿轮。
[const]
GEAR_STYLE = "checked"
BROWSER_FLOW = "menu"
MENU_STYLE = "focus"

[[segment]]
name = "系统广告"
ops = [
  # 这台没有「隐私与安全 → 更多安全设置 → 广告服务」这条路：更多安全设置里只有用户体验计划等项目，
  # 广告服务是 com.android.settings 的独立 Activity，直接拉起最稳，也不再受设置首页滚动位置影响。
  { kind = "start", pkg = "com.android.settings", activity = ".ad.AdServiceSettings" },
  { kind = "off", only = ["个性化广告推荐"], page = "系统·广告服务" },
  { kind = "back" },
]

[[segment]]
name = "应用商店"
code = "step_store"

[[segment]]
name = "手机管家"
ops = [{ kind = "lib", name = "security_center" }]

[[segment]]
name = "下载管理"
ops = [{ kind = "lib", name = "downloads" }]

[[segment]]
name = "主题"
ops = [{ kind = "lib", name = "theme" }]

[[segment]]
name = "浏览器"
ops = [
  # p.start 是「先 app_stop 再起，5 秒内前台必须是本包」。这台冷启动能起，但 start 内部的弹窗清理
  # 会把它顶掉，报「启动后离开前台」（#193 同一条）。这里直接拉起，前台实测 1 秒就稳定。
  { kind = "shell", command = "am force-stop com.android.browser" },
  { kind = "sleep", seconds = 1 },
  { kind = "shell", command = "monkey -p com.android.browser -c android.intent.category.LAUNCHER 1" },
  { kind = "sleep", seconds = 3 },
  { kind = "if_focus", text = "basicmode", match = "icontains", ops = [
    # 拒绝浏览器协议后落到基本模式设置页，设置入口都不在这条路径上，找下去只会空转报错（#414、#460）
    { kind = "print", text = "  · 浏览器处在基本模式，设置入口不在这条路径上，本段跳过" },
    { kind = "return" },
  ] },
  # 底栏按钮是 ViewGroup，只认 80 毫秒短按；input tap 点了没反应
  # 工具栏右上角也有一个叫「设置」的图标，点它打开的是首页编辑面板（页面布局/快捷网址/全网热榜）；
  # 菜单里那个在同一行（头像/菜单编辑/分享/设置），menu_settings() 按 y 坐标排除顶部那个。
  # 底栏没有「菜单」的浏览器版本走「我的」→ 设置（#833；OS4 这份漏改，见 #900）。
  { kind = "lib", name = "browser_settings" },
  { kind = "if_entry", text = "隐私和安全", scrolls = 6, ops = [
    { kind = "off", only = ["个性化内容推荐", "个性化广告推荐"], page = "浏览器·隐私和安全" },
    { kind = "back" },
  ] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "全局搜索"
code = "step_global_search"

[[segment]]
name = "负一屏"
ops = [{ kind = "lib", name = "negative_screen" }]

[[segment]]
name = "天气和日历"
ops = [
  # 两个 App 同一套走法，按包名各展开一份：天气多了「城市管理」，页面标签带包名前缀。
  { kind = "start", pkg = "com.miui.weather2" },
  { kind = "if_find", text = "城市管理", exact = true, edge_ok = "tab", ops = [
    # 新版天气：底部城市管理 → 右上更多设置 → 设置。
    { kind = "tap", text = "城市管理", exact = true, scrolls = 0 },
  ] },
  { kind = "if_lib", name = "gear", ops = [
    { kind = "if_entry", text = "用户体验计划", ops = [
      { kind = "off", only = ["推荐", "广告", "个性化", "内容推广", "天气视频卡片"], page = "com.miui.weather2·用户体验计划" },
      { kind = "back" },
    ] },
    { kind = "back", n = 3 },
  ], else_ops = [
    { kind = "print", text = "  · 本版本没有可识别的设置菜单，跳过" },
  ] },
  { kind = "start", pkg = "com.android.calendar" },
  { kind = "if_lib", name = "gear", ops = [
    { kind = "if_entry", text = "用户体验计划", ops = [
      { kind = "off", only = ["推荐", "广告", "个性化", "内容推广", "天气视频卡片"], page = "com.android.calendar·用户体验计划" },
      { kind = "back" },
    ] },
    { kind = "back", n = 3 },
  ], else_ops = [
    { kind = "print", text = "  · 本版本没有可识别的设置菜单，跳过" },
  ] },
]
