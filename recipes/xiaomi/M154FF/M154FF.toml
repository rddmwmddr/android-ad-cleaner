# 小米 HyperOS 4 机型脚本：Xiaomi 18 Pro Max（M154FF）、Xiaomi 18 Fold（2608BPX34C）、REDMI K90（2510DRK44C）；路径来源：18 Pro Max 2026-10-22 实测（OS4.0.24）；18 Fold 2026-10-24 社区实测（沿用 Issue #2，CP2A.260605.016）。
# 三台系统底包相同（CP2A.260605.016），App 版本不同时页面不同：每一步都兼容新旧两种入口，找不到就跳过。
# K90（OS4.0.5.0.XPKCNXM）按 2026-11-10 社区实测登记（Issue #929）：借这份脚本跑通九段中的八段，
# 主题段要先挂起 com.miui.systemAdSolution；本仓库未在该机复跑。
# 登记的含义是这台机先按本型号直选（recipe_for），不再转去按版本挑同族脚本——#969 修完也一样。
# 用法：python3 tool/run.py -s 序列号 recipe [段名…]   不带段名=全跑
# 2026-11-14 转页面树（#1267）：系统广告 / 应用商店 / 浏览器三段用 `opened()` 的直达探路（回调把
# 拉起函数当参数传），留在同名 `.py` 的 `code =`；其余段按名字调共享段体。
model = "M154FF"
models = ["M154FF", "2608BPX34C", "2510DRK44C"]
build = "OS4.0"

# 浏览器设置入口：先看工具栏齿轮，再点底部「我的」找齿轮。
[const]
BROWSER_FLOW = "toolbar"

[[segment]]
name = "系统广告"
code = "step_system_ads"

[[segment]]
name = "应用商店"
code = "step_store"

[[segment]]
name = "手机管家"
ops = [{ kind = "lib", name = "security_center" }]

[[segment]]
name = "下载管理"
ops = [{ kind = "lib", name = "downloads_probe" }]

[[segment]]
name = "主题"
ops = [{ kind = "lib", name = "theme" }]

[[segment]]
name = "浏览器"
code = "step_browser"

[[segment]]
name = "全局搜索"
ops = [{ kind = "lib", name = "global_search" }]

[[segment]]
name = "负一屏"
ops = [{ kind = "lib", name = "negative_screen" }]

[[segment]]
name = "天气和日历"
ops = [{ kind = "lib", name = "weather_calendar_probe" }]
