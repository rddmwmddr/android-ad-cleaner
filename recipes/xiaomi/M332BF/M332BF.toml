# 小米 HyperOS 4 机型脚本：REDMI K90 Ultra（M332BF）；路径来源：社区报告者 @Sin1ery 2026-10-31 实测（HyperOS OS4.0.4.0.XHPCNXM，Android 17，沿用 Issue #374）。
# 脚本按那份报告里的四处差异重写，本仓库尚未在这台机器上复跑，合并后等报告者复测。
# 用法：python3 tool/run.py -s 序列号 recipe [段名…]   不带段名=全跑
# 2026-11-14 转页面树：段落成导航数据；应用商店与主题「我的」页的换页等待走
# `require_tab` 的 `settle`（按运行时读到的页面签名等）。
model = "M332BF"
models = ["M332BF"]
build = "OS4.0.4"

[[segment]]
name = "系统广告"
ops = [
  # 广告服务在「安全」分栏 →「更多安全设置」页底，直达 AdServiceSettings 从 50 秒降到 2 秒（#374）。
  # 不走 p.start()：这一页的开关说明行是「关闭后，广告数量不会因此减少……」，
  # 启动后的 dismiss() 会把整行 content-desc 当成弹窗 ✕ 点一下，等于替用户拨了一次开关。
  { kind = "start", pkg = "com.android.settings", activity = ".ad.AdServiceSettings", clear_task = true },
  { kind = "require_expect", calls = [{ args = ["个性化广告推荐", 3] }], miss_print = "广告服务页没有打开" },
  { kind = "off", only = ["个性化广告推荐"], page = "系统·广告服务" },
]

[[segment]]
name = "应用商店"
ops = [
  # 偏好页直达（带落点核对）；不通就回「我的 → 设置」。
  {kind = "if_lib", name = "direct_page", args = ["com.xiaomi.market", ".ui.MarketPreferenceActivity"], kwargs = {expect = "通知设置"}, else_ops = [
    {kind = "start", pkg = "com.xiaomi.market"},
    # 底栏用 p.tab：内容区有叫「我的」的游戏（沿用 #386）。这台机换页慢，点完再等 2 秒。
    {kind = "require_tab", name = "我的", settle = 2, miss_print = "商店底部「我的」标签没找到"},
    {kind = "lib", name = "gear"},
  ]},
  {kind = "if_lib", name = "tap_any", args = ["隐私设置", "隐私"], ops = [
    # 「个性化服务」在新版本是子页入口、老版本开关就在本页：按运行时读到的位置分岔。
    {kind = "if_lib", name = "store_privacy_nested", ops = [
      {kind = "if_lib", name = "store_privacy_sub", ops = [
        {kind = "off", only = ["个性化服务"], page = "商店·个性化服务"},
        {kind = "back"},
      ]},
    ], else_ops = [
      {kind = "off", only = ["个性化服务"], page = "商店·个性化服务"},
    ]},
    {kind = "back"},
  ]},
  {kind = "if_entry", text = "通知设置", ops = [
    # 只关「新手帮助」。不碰「推送消息」：它是父开关，关了会连「点赞消息」「评论消息」一起关。
    {kind = "off", only = ["新手帮助"], keep = ["推送消息", "应用更新"], page = "商店·通知设置"},
    {kind = "back"},
  ]},
  {kind = "back", n = 2},
]

[[segment]]
name = "手机管家"
ops = [{ kind = "lib", name = "security_center" }]

[[segment]]
name = "下载管理"
ops = [{ kind = "lib", name = "downloads_probe" }]

[[segment]]
name = "主题"
ops = [
  # 直达主题管理包的代理页（沿用 #730 的做法：它没有 LAUNCHER，monkey 拉不起来）；经主题商店冷启动
  # 还要过一道重定向过渡窗，前台校验容易误判（沿用 #906）。落点被系统转走时仍按跳过收尾。
  { kind = "skip_unless_installed", command = "pm path com.android.thememanager", contains = "package:", text = "  · 本机没有主题管理包，跳过" },
  { kind = "start_or_skip", pkg = "com.android.thememanager", activity = ".ThemeResourceProxyTabActivity", dead_ends = ["com.xiaomi.market", "com.miui.home"], reason = "主题页打不开" },
  # 这台机换页慢：点完「我的」再等 2 秒。
  { kind = "require_tab", name = "我的", settle = 2, miss_print = "主题底部「我的」标签没找到；", evidence = true },
  { kind = "require_lib", name = "gear", miss_print = "主题设置入口没找到；", fail = true, evidence = true },
  { kind = "await_page" },
  { kind = "off_required", only = ["每次联网时通知"], keep = ["自动更新"], page = "主题·设置", contains = true },
  { kind = "if_entry", text = "隐私设置", ops = [
    { kind = "off", only = ["个性化推荐"], page = "主题·隐私" },
    { kind = "back" },
  ] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "浏览器"
ops = [
  # 工具栏齿轮点进去是首页编辑面板（页面布局 / 快捷网址 / 全网热榜），主设置页是
  # com.android.browser/.BrowserSettingsActivity（#374）。关「个性化内容推荐 / 个性化广告推荐」
  # 各弹一次「关闭提醒」，必须点「确认关闭」，点「以后再说」等于没关；确认框由 p.off() 处理。
  { kind = "start", pkg = "com.android.browser", activity = ".BrowserSettingsActivity", expect = "设置", budget = 2 },
  { kind = "if_entry", text = "隐私和安全", ops = [
    { kind = "off", only = ["个性化内容推荐", "个性化广告推荐"], page = "浏览器·隐私和安全" },
    { kind = "back" },
  ] },
  { kind = "if_entry", text = "主页设置", ops = [
    { kind = "off", only = ["宫格位推送"], page = "浏览器·主页设置" },
    { kind = "back" },
  ] },
  { kind = "if_entry", text = "搜索设置", ops = [
    { kind = "off", only = ["猜你想搜"], page = "浏览器·搜索设置" },
    { kind = "back" },
  ] },
  { kind = "if_entry", text = "功能设置", ops = [
    # 新版浏览器这三项不一定都在，有就关
    { kind = "off", only = ["小说"], page = "浏览器·功能设置" },
    { kind = "back" },
  ] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "全局搜索"
ops = [{ kind = "lib", name = "global_search" }]

[[segment]]
name = "负一屏"
ops = [{ kind = "lib", name = "negative_screen" }]

[[segment]]
name = "天气和日历"
ops = [{ kind = "lib", name = "weather_calendar_probe" }]
