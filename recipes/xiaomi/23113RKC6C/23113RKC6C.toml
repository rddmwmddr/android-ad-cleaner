# Redmi K70（23113RKC6C），HyperOS OS3.0.307.0.WNKCNXM / Android 16。2026-10-26 无线调试实测：系统广告段临时开启后关闭，39 秒、调整 1 项、回读确认。
# 其余 8 段已按 K70 实际入口补入；浏览器 2 项、天气 2 项、日历 1 项已实际关闭。
# 浏览器「小说」是功能入口，验证后已从本脚本移除；「最新资讯」为 disabled，无法操作。
# 参考脚本 9 段安全模式实测调整 14 项；最终脚本在有线原生 1440×3200 上复跑 230 秒、0 调整、0 步骤异常（移除小说前的无线复跑为 307 秒）。
# 不能把这份脚本当成整机适配完成。
# 2026-11-14 转页面树（#1266）：八段按名字调用共享段体，浏览器一段落成导航数据。
model = "23113RKC6C"
models = ["23113RKC6C"]
build = "OS3.0.307.0"
tail = "tail"

[[segment]]
name = "系统广告"
ops = [{ kind = "lib", name = "system_ads_security" }]

[[segment]]
name = "应用商店"
ops = [{ kind = "lib", name = "store" }]

[[segment]]
name = "手机管家"
ops = [{ kind = "lib", name = "security_center" }]

[[segment]]
name = "下载管理"
ops = [{ kind = "lib", name = "downloads" }]

[[segment]]
name = "主题"
ops = [{ kind = "lib", name = "theme" }]

[[segment]]
name = "浏览器"
ops = [
  { kind = "start", pkg = "com.android.browser" },
  # 拒绝浏览器协议后落到基本模式设置页，设置入口都不在这条路径上，找下去只会空转报错（#414、#460）。
  # 前台名的大小写不保证，旧脚本先小写再比（`focus().lower()`）。
  { kind = "if_focus", text = "basicmode", match = "icontains", ops = [
    { kind = "print", text = "  · 浏览器处在基本模式，设置入口不在这条路径上，本段跳过" },
    { kind = "return" },
  ] },
  { kind = "lib", name = "mine_settings" },
  { kind = "if_entry", text = "主页设置", ops = [
    { kind = "off", only = ["宫格位推送"], page = "浏览器·主页设置" },
    { kind = "back" },
  ] },
  { kind = "if_entry", text = "搜索设置", ops = [
    { kind = "off", only = ["显示猜你想搜模块"], page = "浏览器·搜索设置" },
    { kind = "back" },
  ] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "全局搜索"
ops = [{ kind = "lib", name = "global_search" }]

[[segment]]
name = "负一屏"
ops = [{ kind = "lib", name = "negative_screen" }]

[[segment]]
name = "天气和日历"
ops = [{ kind = "lib", name = "weather_calendar_tap" }]
