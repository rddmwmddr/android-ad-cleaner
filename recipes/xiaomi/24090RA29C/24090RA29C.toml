# 小米 / Redmi HyperOS 3 机型脚本：Redmi Note 14 Pro（24090RA29C）；路径来源：2026-10-26 真机实测，HyperOS OS3.0.309.0.WOOCNXM（Android 16，BP2A.250605.031.A3）。
# 与 M154FF（OS4.0）的差异：系统广告的「更多安全设置」在「安全」标签页下，不在隐私页首屏；
# 主题、浏览器的设置是无文字齿轮（content-desc=设置），首页「我的」是底部标签。
# 用法：python3 tool/run.py -s 序列号 recipe [段名…]   不带段名=全跑
# 2026-11-14 转页面树（#1266）：系统广告与浏览器落成导航数据；主题段按文字坐标点「我的」标签，
# 留在同名 `.py` 的 `code =`。
model = "24090RA29C"
models = ["24090RA29C"]
build = "OS3.0.309.0"

[[segment]]
name = "系统广告"
ops = [
  # 不用设置搜索：HyperOS 搜索框用 setText 输入中文会卡住、一直打「%」。按菜单路径点进去
  { kind = "shell", command = "am start -f 0x10008000 -a android.settings.SETTINGS" },
  { kind = "sleep", seconds = 1.2 },
  { kind = "if_entry", text = "隐私与安全", ops = [
    # OS3.0：隐私页首屏没有「更多安全设置」，它在「安全」标签页下
    { kind = "if_entry", text = "更多安全设置", else_ops = [
      { kind = "lib", name = "tap_tab", args = ["安全"] },
      { kind = "entry", text = "更多安全设置" },
    ] },
    { kind = "if_entry", text = "广告服务", ops = [
      { kind = "off", only = ["个性化广告推荐"], page = "系统·广告服务" },
    ] },
  ] },
]

[[segment]]
name = "应用商店"
ops = [{ kind = "lib", name = "store_mode" }]

[[segment]]
name = "手机管家"
ops = [{ kind = "lib", name = "security_center" }]

[[segment]]
name = "下载管理"
ops = [{ kind = "lib", name = "downloads" }]

[[segment]]
name = "主题"
code = "step_theme"

[[segment]]
name = "浏览器"
ops = [
  # 首页「默认 / 探索版 / 自定义主页」不改：按机主喜好。
  # 底栏「我的」标签在部分启动状态下点不动，直达设置页 Activity，绕开首页导航。
  { kind = "shell", command = "am start -n com.android.browser/.BrowserSettingsActivity" },
  { kind = "sleep", seconds = 2 },
  { kind = "dismiss" },
  { kind = "if_entry", text = "隐私和安全", ops = [
    { kind = "off", only = ["个性化内容推荐", "个性化广告推荐"], page = "浏览器·隐私和安全" },
    { kind = "back" },
  ] },
  # 新版浏览器这三项都没有，有就关。
  { kind = "if_entry", text = "主页设置", ops = [
    { kind = "off", only = ["宫格位推送"], page = "浏览器·主页设置" },
    { kind = "back" },
  ] },
  { kind = "if_entry", text = "搜索设置", ops = [
    { kind = "off", only = ["猜你想搜"], page = "浏览器·搜索设置" },
    { kind = "back" },
  ] },
  { kind = "if_entry", text = "功能设置", ops = [
    { kind = "off", only = ["小说"], page = "浏览器·功能设置" },
    { kind = "back" },
  ] },
  { kind = "back", n = 2 },
]

[[segment]]
name = "全局搜索"
ops = [{ kind = "lib", name = "global_search" }]

[[segment]]
name = "负一屏"
ops = [{ kind = "lib", name = "negative_screen" }]
