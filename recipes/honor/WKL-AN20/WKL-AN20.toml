# 荣耀 WKL-AN20，MagicOS 11 / Android 17 的页面树（catalog，#1262）。路径逐项实测：2026-10-28。
# 整轮待真机复测；音乐须先由机主打开「更多设置」，再单段运行。不含通知渠道、挂包或 Scene 激活。
# 线性段是数据；过程化的段（safe_ui 坐标手势、radio 单选组、循环、按 `rt.only` 分岔）走 code= 例外函数。
model = "WKL-AN20"
models = ["WKL-AN20"]
build = "WKL-AN20 11.0.0.111(SP7C00E110R101P7)"
guard = "guard"
wrap = "safe_ui"
tail = "tail"

[const]
TAP_STYLE = "honor"
APP_SETTINGS_STYLE = "honor"
BROWSER_FLOW = "honor_plain"

[[segment]]
name = "广告跟踪"
# 裁决：缺能力。卡在 `close_named_honor(…, None, …)`：名单写 None 表示整页全关，TOML 没有 null，
# 这个值传不进 `args`（`settle_page` 本身已进数据词汇）
code = "step_ad_tracking"

[[segment]]
name = "智能推荐服务"
ops = [
  {kind = "start", pkg = "com.hihonor.id", activity = ".oaid.ui.IntelligentRecommendActivity"},
  {kind = "lib", name = "close_named_honor", args = [["智能推荐服务"], "广告与隐私·智能推荐服务", "com.hihonor.id", "智能推荐服务"]},
]

[[segment]]
name = "系统管家"
ops = [
  {kind = "start", pkg = "com.hihonor.systemmanager", activity = ".mainscreen.SettingActivity"},
  {kind = "lib", name = "close_named_honor", args = [["应用推荐"], "系统管家·设置", "com.hihonor.systemmanager", "设置"]},
]

[[segment]]
name = "应用市场"
ops = [
  {kind = "lib", name = "app_settings", args = ["com.hihonor.appmarket", "内容推荐服务", "消息通知管理"]},
  {kind = "lib", name = "tap", args = ["内容推荐服务"]},
  {kind = "lib", name = "close_named_honor", args = [["营销服务推荐", "个性化服务推荐"], "市场·内容推荐服务", "com.hihonor.appmarket", "内容推荐服务"]},
  {kind = "back"},
  {kind = "lib", name = "tap", args = ["消息通知管理"]},
  {kind = "lib", name = "close_named_honor", args = [["消息通知"], "市场·消息通知管理", "com.hihonor.appmarket", "消息通知管理"]},
  {kind = "back"},
  {kind = "lib", name = "tap", args = ["消息中心提醒"]},
  {kind = "lib", name = "close_named_honor", args = [["活动福利", "游戏动态"], "市场·消息中心提醒", "com.hihonor.appmarket", "消息中心提醒"]},
  {kind = "back"},
  {kind = "lib", name = "tap", args = ["热门推荐管理"]},
  {kind = "lib", name = "close_named_honor", args = [["热门推荐管理"], "市场·热门推荐管理", "com.hihonor.appmarket", "热门推荐管理"]},
]

[[segment]]
name = "浏览器首页"
# 裁决：「坐标算法」+ 回读。按 RadioButton 的 bounds 点中心，再读 `checked` 确认
code = "step_browser_home"

[[segment]]
name = "浏览器推荐"
ops = [
  # 设置页的包名由库现取一次，后面三次关单都拿它当实参（`let` + `{expr = "var"}`，#1373）。
  {kind = "let", name = "package", lib = "browser_settings"},
  {kind = "lib", name = "tap", args = ["消息通知"]},
  {kind = "lib", name = "close_named_honor", args = [["精彩推荐", "每日推送", "新闻热点", "兴趣推送"], "浏览器·消息通知", {expr = "var", name = "package"}, "消息通知"]},
  {kind = "back"},
  {kind = "lib", name = "tap", args = ["隐私管理"]},
  {kind = "lib", name = "tap", args = ["个性化推荐"], kwargs = {scrolls = 0}},
  {kind = "lib", name = "close_named_honor", args = [["个性化内容"], "浏览器·个性化推荐", {expr = "var", name = "package"}, "个性化推荐"]},
  {kind = "back"},
  {kind = "lib", name = "tap", args = ["互动广告管理"], kwargs = {scrolls = 0}},
  {kind = "lib", name = "close_named_honor", args = [["个性化广告", "允许摇一摇进入广告"], "浏览器·互动广告", {expr = "var", name = "package"}, "互动广告管理"]},
]

[[segment]]
name = "视频"
ops = [
  {kind = "start", pkg = "com.hihonor.youku.video", activity = "com.youku.android.youkusetting.activity.SettingsActivity"},
  {kind = "lib", name = "tap", args = ["其他设置"]},
  {kind = "lib", name = "close_named_honor", args = [["个性化内容", "个性化广告", "允许视频采集OAID推荐广告"], "视频·其他设置", "com.hihonor.youku.video", "其他设置"]},
]

[[segment]]
name = "搜索"
# 裁决：缺能力 + 「坐标算法」。桌面下滑是 `p.swipe` 的绝对坐标手势；数据里的 `gesture` 走
# `input swipe`，比例相同但另一条下发路径，换过去真机行为不一致
code = "step_search"

[[segment]]
name = "负一屏"
# 裁决：「循环」。右滑最多三次，要看当前是否已进面板再决定划不划
code = "step_negative"

[[segment]]
name = "阅读"
ops = [
  {kind = "start", pkg = "com.hihonor.dz.reader"},
  {kind = "require_go", text = "我的", expect = "更多设置", miss_print = "未找到阅读设置入口"},
  {kind = "lib", name = "tap", args = ["更多设置"]},
  # 这一页的开关是自绘的，点下一行之前先等版面定下来（`settle_page`，与 `wait_page` 同档，#1371）。
  {kind = "lib", name = "settle_page", args = ["com.hihonor.dz.reader", "广告推荐服务"]},
  {kind = "lib", name = "tap", args = ["广告推荐服务"], kwargs = {scrolls = 0}},
  {kind = "lib", name = "close_named_honor", args = [["个性化广告"], "阅读·广告推荐服务", "com.hihonor.dz.reader", "广告推荐服务"], kwargs = {drawn = true}},
]

[[segment]]
name = "主题"
ops = [
  {kind = "lib", name = "app_settings", args = ["com.hihonor.android.thememanager", "个性化服务", "通知"]},
  {kind = "lib", name = "tap", args = ["个性化服务"], kwargs = {scrolls = 0}},
  {kind = "lib", name = "close_named_honor", args = [["个性化内容", "个性化广告"], "主题·个性化服务", "com.hihonor.android.thememanager", "个性化服务"]},
  {kind = "back"},
  {kind = "lib", name = "tap", args = ["通知"], kwargs = {scrolls = 0}},
  {kind = "lib", name = "close_named_honor", args = [["消息通知", "短信", "邮件"], "主题·内容推荐和活动通知", "com.hihonor.android.thememanager", "通知"]},
]

[[segment]]
name = "魔法画报"
ops = [
  {kind = "require_setting", kw = "画报", entry = "魔法画报", miss_print = "未搜到魔法画报"},
  # 设置搜索也可能已经落在画报页，这时不用再点。前台窗口原文是「包名/Activity」，带斜杠才分得清
  # 前缀——`com.hihonor.magazine/…` 认，`com.hihonor.magazine2/…` 不认。
  {kind = "if_focus", text = "com.hihonor.magazine/", match = "starts", else_ops = [
    {kind = "lib", name = "tap", args = ["魔法画报"], kwargs = {scrolls = 0}},
  ]},
  {kind = "lib", name = "close_named_honor", args = [["锁屏壁纸轮播", "锁屏进入魔法画报", "数据流量自动更新"], "魔法画报", "com.hihonor.magazine", "魔法画报"]},
]

[[segment]]
name = "音乐"
# 裁决：缺能力。按 `rt.only` 的段过滤分岔（只有单跑这一段才做得成），数据没有这个 op；
# 只此一台机型，按 ADR-0038 的「≥2 机型用法」不新增
code = "step_music"
