# 每份机型脚本最后一次真机验证（#916）。读它、打印它：python3 tool/verify_ledger.py
#
# key 是相对 recipes/ 的路径：同一目录下的变体各记一条，不是目录级。
# ["xiaomi-24129PN74C/recipe_os4.py"]
# build = "24129PN74C_OS4.0.1.0.WNDCNXM"   # 真机上的系统 build 串，能认出完整串就写全
# date = "2026-11-05"                      # 验证日期，YYYY-MM-DD
# by = "@login"                            # 验证人：@login（带 @）或 机主，与复测队列同格式
# tier = "部分"                            # 覆盖度：全部 / 部分 / 未记录
# evidence = "报告者自述"                  # 证据来源：用例 / 现场 / 报告者自述 / 机主自测 / 未知
# body_hash = "0123456789abcdef"           # 段体哈希：段体归一后的摘要（页面树数据还含同名例外 .py），见下
#
# 覆盖度与证据来源是两个正交维度（#1124 之前是同一个 tier）：一个是「跑到什么程度」，一个是
# 「凭什么算跑过」，别用一个字段同时表达。
#   - 覆盖度：「全部」= 整份脚本整跑过，结局只有「完成」或 `SkipStep` 的「跳过」（跳过是引擎的
#     正式语义，不扣覆盖度）；「部分」= 只跑了几段，或只手动把入口走通；「未记录」= 没有可信记录，
#     日期、验证人、build 一并留空。
#   - 证据来源：「用例」= 有去掉改动就会红的回归用例；「现场」= 有 dump / 日志 / 输出；「报告者
#     自述」= 报告者口头确认，不要求交 dump；「机主自测」= 维护者自己的机器；「未知」= 说不上来。
# 新增条目照实填两格：覆盖度按实际跑到的段数，证据来源按手里最硬的那一样，两者互不代替。
#
# build 必须以脚本自己声明的 BUILD 打头；认不出更细的版本时才写 BUILD 本身。对不上时命令行标
# 「build 不符」，数据契约测试报红。覆盖度是「未记录」的条目不做这项校验，build 可以留空。
#
# body_hash 是段体归一后的摘要，记的是**当初在真机上验证的那份段体**（算法只在
# `tool/verify_ledger.py`）。它对不上现在的脚本时命令行标「待复核」——判据是段体内容变没变，不是
# 文件改没改：改注释与 docstring 不算改，改段体或改段名才算。页面树数据（`.toml`）的段体是每段
# 规范化后的数据，外加整份同名例外 `.py` 的模块体（`code=` 那些段就住在那儿）；例外 `.py` 按整
# 文件算，所以那份文件里改哪儿都会翻成待复核——挪函数、把助手搬进库也算（#1276）。旧形态的
# `.py` 机型脚本只取 `@step` 函数正文，那边顺序与位置都不进哈希。
# 刷新它：`python3 tool/verify_ledger.py --hash` 打印每份脚本当前的值，只打印不写文件；真机验证或
# 发版后照抄进对应条目。没有 body_hash 的旧记录按「尚未建立基线」处理，不标「待复核」。
# 2026-11-14 的形态迁移（#1262–#1267）之前的哈希取自旧算法（`@step` 段体），与现在的 `.toml` 口径
# 不同、值必然对不上；迁移后还没真机复跑的条目会一直显示「待复核」，直到复跑后照抄 `--hash`。
# 不要把哈希刷新成新形态来消掉这个提示：那会把「验证过的是旧形态」抹成「已验证」。
# #1276 又把例外 `.py` 拼进了页面树数据的哈希，所以迁移后已复跑、已照抄过 `--hash` 的条目（PYB110）
# 也再翻一次——它验的时候例外代码还没进哈希。没复跑的条目本来就一直显示「待复核」，不在这条上。
#
# 2026-11-09 初始化（#918）：44 份的日期与档位取自配方头注，不按措辞分档，一律「部分验证」。
# 头注里的日期混着「改动日期」，只取最后一次真机验证那一条（如 vivo-V2547DA/recipe.py 记 10-28，
# 11-03 与 11-07 两行头注都写着「未复测」）。by 取头注能认出的验证人：写了 @login 的按 @login 记，
# 只写「社区实测」没留 ID 的留空，其余按机主。头注没写日期、但同目录 README 或 docs/ 有更近一次
# 真机记录的，按那份记并在条目上方注明出处。唯一没有日期的 vivo-V2545A 记「未记录」。
#
# 2026-11-12 拆档（#1124）：tier 收窄为覆盖度、新增 evidence。覆盖度按当时实际覆盖面机械换算：
# 「已验证」只有一加 16（PYB110，本机九段整跑）记「全部」，其余「部分验证」记「部分」，「未记录」照旧。
# evidence 只由 by 推导：机主 → 机主自测，@login → 报告者自述，留空 → 未知。没有重读脚本头注，也
# 没有重新判断覆盖度以外的任何东西；「用例」与「现场」两档留给之后新增的条目。所以 by 留空的条目
# 即便上方注释写着「社区实测」（没留 ID），evidence 仍是「未知」——记不上人，不是漏填。

